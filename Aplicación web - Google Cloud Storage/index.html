<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFG Borja Domínguez Martín</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script> 
</head>
</head>
<body>
  <div class="bouncing-blobs-container">
    <div class="bouncing-blobs-glass"></div>
    <div class="bouncing-blobs">
      <div class="bouncing-blob bouncing-blob--blue"></div>
      <div class="bouncing-blob bouncing-blob--blue"></div>
      <div class="bouncing-blob bouncing-blob--blue"></div>
      <div class="bouncing-blob bouncing-blob--white"></div>
      <div class="bouncing-blob bouncing-blob--purple"></div>
      <div class="bouncing-blob bouncing-blob--purple"></div>
      <div class="bouncing-blob bouncing-blob--pink"></div>
    </div>
  </div>
  <div class="login-container">
    <form class="login-form">
      <div class="input-group">
        <div class="field-container">
          <img src="https://planestrategico.uah.es/export/sites/plan-estrategico/assets/img/logo_blanco.png" alt="Logo" class="login-logo">
          <h2><span class="centered-title">TFG</span><br><span class="centered-title2">Borja Domínguez Martín</span></h2>
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Introduce tu usuario" required>
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Escribe aquí tu contraseña" required>
          <label for="repeat-password" style="display:none;">Repite tu contraseña</label>
          <input type="password" id="repeat-password" placeholder="Repite tu contraseña" style="display:none;" required>
          <span id="password-error" style="display: none; color: red; text-align: right; width: 100%;">Las contraseñas no coinciden.</span>
          <span id="login-error" style="display: none; color: red; text-align: right; width: 100%;">Usuario o contraseña no encontrados.</span>
          <span id="register-error" style="display: none; color: red; text-align: right; width: 100%;">El usuario ya está registrado.</span>
          <button type="submit" id="submit-button">Log In</button>
          <div class="account-options">
            <p class="account-toggle" style="text-align: center;">
              <span id="no-account-text">¿No tienes una cuenta?</span>
              <a href="javascript:void(0);" id="create-account-link" class="account-link">Crea una 🚀</a>
              <span id="has-account-text" style="display:none;">¿Ya tienes una cuenta?</span>
              <a href="javascript:void(0);" id="login-link" class="account-link" style="display:none;">Inicia sesión 🚀</a>
            </p>
          </div>
          <a href="#" class="UAH-firma">Grado en Ingeniería Telemática <br>Universidad de Alcalá <br>2017 - 2024</a>
        </div>
      </div>
    </form>
  </div>
  <script src="main.js"></script>
</body>
</html>
